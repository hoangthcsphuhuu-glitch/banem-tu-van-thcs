name: Build Android APK & Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Android APK (banem THCS)
        run: python build_apk.py

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TroLyTuVanTHCS-Android-APK
          path: TroLyTuVanTHCS-Android.apk

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "www"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
